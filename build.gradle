plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecraft_mode" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Data generation: `./gradlew runDatagen` writes JSON (recipes, models, loot tables, tags, lang)
	// into src/main/generated, which is included as a resource directory.
	configureDataGeneration {
		client = true
	}

	// Client game tests: `./gradlew runClientGameTest` boots the game, creates a world,
	// runs src/gametest and saves screenshots to build/run/clientGameTest/screenshots.
	configureTests {
		createSourceSet = true
		modId = "minecraft_mode_test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs.addAll(["-Xlint:deprecation", "-Xlint:unchecked"])
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

// Two scripted clients for MultiplayerClientGameTest: start `./gradlew runServer` (offline mode, RCON on) first, then
// `./gradlew runMpAlice -PmpRcon=<password>` and `./gradlew runMpBob`. The clients keep their own game directories.
loom {
	runs {
		mpAlice {
			inherit loom.runs.getByName("clientGameTest")
			name "Multiplayer test (Alice)"
			runDir "build/run/mpAlice"
			property "minecraft_mode.mp.role", "alice"
			property "minecraft_mode.mp.dir", file("build/mp").absolutePath
			property "minecraft_mode.mp.rcon", (project.findProperty("mpRcon") ?: "").toString()
			programArgs "--username", "Alice"
		}
		mpBob {
			inherit loom.runs.getByName("clientGameTest")
			name "Multiplayer test (Bob)"
			runDir "build/run/mpBob"
			property "minecraft_mode.mp.role", "bob"
			property "minecraft_mode.mp.dir", file("build/mp").absolutePath
			programArgs "--username", "Bob"
		}
	}
}
